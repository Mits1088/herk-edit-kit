<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Content Command Centre</title>
<style>
:root{
  --bg:#f2f4f8; --surface:#ffffff; --sunk:#e9edf3; --ink:#131a2a; --muted:#5a6579; --line:#d9dfe8;
  --accent:#2f4bd8; --accent-ink:#ffffff;
  --you:#8a4b00; --you-bg:#ffedc7; --ok:#0b6b45; --ok-bg:#d8f3e5; --bad:#a8271b; --bad-bg:#fde2de;
  --wait:#4b5870; --wait-bg:#e6eaf1; --run:#2f4bd8; --run-bg:#e2e7ff;
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif; --body:"Inter","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",Consolas,ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0e121b; --surface:#171d2a; --sunk:#1f2636; --ink:#e8ecf5; --muted:#98a3b8; --line:#2a3246;
  --accent:#8fa3ff; --accent-ink:#0e121b;
  --you:#ffc766; --you-bg:#3a2c0c; --ok:#6fdcaa; --ok-bg:#0f2e22; --bad:#ff9c92; --bad-bg:#3a1512;
  --wait:#aab5c9; --wait-bg:#232b3c; --run:#aab8ff; --run-bg:#1d2550; color-scheme:dark } }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 48px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:700} h2{font-size:19px;font-weight:600} h3{font-size:15px;font-weight:600}
p{margin:0}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.nav,.tabs{display:flex;flex-wrap:wrap;gap:6px}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav button,.tabs button{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:999px;font-weight:500}
.nav button[aria-current="true"],.tabs button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{display:inline-block;min-width:20px;text-align:center;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--you-bg);color:var(--you);font-size:12px;font-weight:600}
.note{margin-top:8px;color:var(--muted);font-size:13px}
main{margin-top:20px;display:grid;gap:20px}
.sec-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between}
.sub{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.you{background:var(--you-bg);color:var(--you)} .ok{background:var(--ok-bg);color:var(--ok)} .bad{background:var(--bad-bg);color:var(--bad)}
.wait{background:var(--wait-bg);color:var(--wait)} .run{background:var(--run-bg);color:var(--run)}
.unkp{border:1px dashed var(--muted);color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.group{display:grid;gap:8px;align-content:start}
.group>h3{color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-size:12px;font-family:var(--body)}
.task{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.task:hover,.prow:hover{border-color:var(--accent)}
.task strong{font-weight:600} .task .go{color:var(--accent);font-weight:600;font-size:13px}
.task .sub{grid-column:1/-1}
summary{cursor:pointer;padding:6px 0} .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;align-items:start}
.rows{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:minmax(170px,1fr) minmax(0,3fr);gap:8px 18px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;align-items:start}
.prow.dim{opacity:.62}
.pipeline-item{display:grid;gap:6px}
.pipeline-item>.row{justify-content:flex-end}
.prow .pt{display:grid;gap:3px} .prow .pt strong{font-weight:600;line-height:1.3}
.prow .pr{display:grid;gap:7px;min-width:0}
.pn{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
@media (max-width:720px){.prow{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.track{display:flex;flex-wrap:wrap;gap:3px}
.track span{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.track .past{background:var(--ok-bg);color:var(--ok)} .track .now{background:var(--run-bg);color:var(--run);font-weight:600}
.track .need{background:var(--you-bg);color:var(--you);font-weight:600;outline:1.5px solid var(--you)} .track .fail{background:var(--bad-bg);color:var(--bad);font-weight:600;outline:1.5px solid var(--bad)}
.track .nr,.track .unk{background:none;border:1px dashed var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;font-size:13px;font-weight:500} .seg button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.back{background:none;border:0;padding:0;color:var(--accent);font-weight:600}
.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--you);margin-left:6px;vertical-align:middle}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;align-items:start}
.script{background:var(--sunk);border-radius:8px;padding:12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 10px;font-size:13px}
a.btn{text-decoration:none;display:inline-block}
.inp{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;max-width:340px}
.inp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.form{display:grid;gap:6px}
select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;max-width:100%}
.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:5px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.cap{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.block{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:14px}
.info{background:var(--run-bg);color:var(--run);border-radius:8px;padding:9px 12px;font-size:14px}
.unknown{border:1px dashed var(--muted);border-radius:8px;padding:9px 12px;font-size:14px;color:var(--muted)}
.unknown ul{margin:4px 0 0;padding-left:18px}
video{width:220px;max-width:100%;aspect-ratio:9/16;background:#000;border-radius:10px}
.media{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
@media (max-width:560px){.media{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:13px} td,th{text-align:left;padding:4px 10px 4px 0;border-bottom:1px dashed var(--line)}
.scroll{overflow-x:auto}
.day{display:grid;grid-template-columns:170px 1fr;gap:6px 16px;padding:12px 0;border-top:1px solid var(--line)}
@media (max-width:560px){.day{grid-template-columns:1fr}}
.ev{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:none;border:0;padding:3px 0;text-align:left}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:min(92vw,520px);z-index:20}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Content Command Centre</h1><nav class="nav" id="nav" aria-label="Views"></nav></div>
  <p class="note" id="status">Loading…</p>
  <main id="app"></main>
</div>
<div id="toast" role="status" hidden></div>
<script>
let S = null, view = 'attention', cur = null, tab = 'scripts', detail = null, showAll = false, pubOpen = null, liveOpen = false;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = d => d ? new Date(d).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:S&&S.dueTimeZone||undefined}) : '';
const dueTxt = d => fmt(d)+(S.dueProvisional?' (provisional)':'');
const tzNote = () => `${String(S.dueHour).padStart(2,'0')}:00 ${S.dueTimeZone}`;
const NAME = {source:'Source received',rewrite:'Rewriting',choose:'Choose script',record:'Record voiceover',avatar:'HeyGen avatar',hook:'Hook review',build:'Building',render:'Rendering candidate',qa:'QA',candidate:'Approve candidate',instagram:'Instagram',distribute:'Shorts and TikTok',done:'Done'};
const TR = [['source','Source'],['rewrite','Rewrite'],['choose','Script'],['record','Voice'],['avatar','Avatar'],['hook','Hook'],['build','Build'],['render','Render'],['qa','QA'],['candidate','Approve candidate'],['instagram','Instagram'],['yt','Shorts'],['tt','TikTok']];
const MARK = {past:'✓ ',need:'● ',now:'… ',fail:'✕ ',unk:'? '};
const RES = {'not-required':['','PDF not required'],pending:['wait','PDF decided at approval'],unknown:['unkp','PDF unknown'],'not-built':['you','PDF not built'],draft:['run','PDF built, not live'],live:['ok','PDF live']};
const idx = it => S.stages.indexOf(it.stage);
const visible = () => S.items.filter(i => showAll==='hidden' ? i.hidden : showAll ? !i.hidden : i.active);
const left = d => { const h = Math.round((new Date(d) - Date.now())/3600e3); if (h <= 0) { const a = -h; return a < 24 ? `due ${a} h ago` : `overdue by ${Math.floor(a/24)} d`; } return h < 24 ? `in ${h} h` : `in ${Math.floor(h/24)} d ${h%24} h`; };

// navigator.clipboard needs https or localhost, so a phone on the home network uses the older copy command.
function copyText(t){ if(navigator.clipboard&&window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise((ok,no)=>{ const a=document.createElement('textarea'); a.value=t; a.setAttribute('readonly',''); a.style.cssText='position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(a); a.select(); a.setSelectionRange(0,t.length); let r=false; try{ r=document.execCommand('copy'); }catch(_){} a.remove(); r?ok():no(); }); }
const nowLocal = () => new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,m.length>80?12000:3500); }
async function load(quiet){ try{ const r=await fetch('/api/state'); S=await r.json(); if(cur){ cur=S.items.find(i=>i.id===cur.id)||null; if(!cur) view='attention'; }
    const q=S.queue; $('#status').textContent=`Read from your files at ${new Date(S.generatedAt).toLocaleTimeString('en-GB')}. ${q.available&&q.running?'Job queue: '+q.missions.length+' jobs':'Job status unavailable ('+q.reason+')'}. It reads your workflow files and changes one only when a button says so.${S.remote?' Phone view: copy captions, download the video and record what you published. Everything else stays on the PC.':''}${S.warnings.length?' Warnings: '+S.warnings.join('; '):''}`;
    render(); }catch(e){ if(!quiet) $('#status').textContent='Could not read state: '+e.message; } }
async function act(a,msg){ const r=await fetch('/api/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(a)}); const j=await r.json(); if(!r.ok){ toast(j.error||'That did not work'); return; } toast(j.message&&j.message!=='Saved'?j.message:(msg||'Saved')); await load(); }
async function open(id,t){ cur=S.items.find(i=>i.id===id); if(!cur) return; tab=t||(cur.needs[0]||{}).tab||'scripts'; detail=null; pubOpen=null; liveOpen=false; fbOpen=false; studio={}; render(); window.scrollTo(0,0);
  try{ const r=await fetch('/api/item?id='+encodeURIComponent(id)); detail=await r.json(); if(cur&&cur.id===id) render(); }catch(_){} }

function track(it){ const i=idx(it); const need=it.needs.some(n=>n.group==='Production'||n.group==='Publishing');
  return `<span class="track">${TR.map(([k,l])=>{ let c='';
    if(k==='yt'||k==='tt'){ const st=it.platforms[k].state; c=st==='published'?'past':st==='due'?'need':st==='not-recorded'?'unk':''; }
    else if(k==='instagram'){ const st=it.platforms.ig.state; c=st==='published'?'past':st==='blocked'?'fail':st==='ready'?'need':(st==='unconfirmed'||st==='unknown')?'unk':''; }
    else { const j=S.stages.indexOf(k); c=j<i?(it.videoOnly&&j<=2?'unk':'past'):j===i?(it.fail?'fail':need?'need':it.dormant?'unk':'now'):''; }
    return `<span class="${c}">${MARK[c]||''}${l}</span>`; }).join('')}</span>`; }
function nextAct(it){ const n=it.needs.filter(x=>x.group==='Production'||x.group==='Publishing');
  if(it.setAside) return ['Idle','Set aside: not currently working on this'];
  if(it.fail) return ['You','Recover: '+it.fail];
  if(n.length) return ['You',n.map(x=>x.label).join(' + ')];
  if(it.needs.length) return ['Link',it.needs.map(x=>x.label).join(' + ')];
  if(it.dormant) return ['Idle',it.note||'Set aside'];
  if(it.stage==='done') return ['Done','Published on Instagram, Shorts and TikTok'];
  if(it.stage==='distribute'&&['yt','tt'].some(k=>it.platforms[k].state==='not-recorded')) return ['Unknown','Shorts and TikTok: posted before the dashboard recorded them'];
  if(it.stage==='distribute') return ['Wait',`Shorts and TikTok fall due ${dueTxt(it.due)}`];
  return ['System',it.note||NAME[it.stage]]; }
const WHO = {You:['you','Next: You'],Link:['you','Needs linking'],Idle:['wait','Idle'],Unknown:['unkp','Not recorded'],Wait:['wait','Waiting for the date'],Done:['ok','Complete'],System:['run','Next: System']};
function resPill(it){ const g=it.resource.gate; if(it.resource.state!=='live'&&(g==='awaiting'||g==='changed')) return `<span class="pill you">PDF awaiting your approval · ${esc(it.resource.keyword)}</span>`;
  if(it.resource.state!=='live'&&g==='approved') return `<span class="pill run">PDF approved, not live · ${esc(it.resource.keyword)}</span>`;
  const r=RES[it.resource.state]||['unkp','PDF unknown']; return r[0]?`<span class="pill ${r[0]}">${r[1]}${it.resource.keyword?' · '+esc(it.resource.keyword):''}</span>`:`<span class="track"><span class="nr">${r[1]}</span></span>`; }

function renderNav(){ const n=S.items.filter(i=>i.active).reduce((a,i)=>a+i.needs.filter(x=>x.group!=='Unlinked video').length,0);
  $('#nav').innerHTML=[['attention',`Needs me <span class="count">${n}</span>`],['pipeline','Pipeline'],['schedule','Schedule']].map(([k,l])=>`<button data-view="${k}" aria-current="${view===k&&!cur}">${l}</button>`).join(''); }

function vAttention(){ const all=S.items.filter(i=>i.active).flatMap(i=>i.needs.map(n=>({...n,it:i})));
  const list=g=>{ const a=all.filter(x=>x.group===g); return a.length?a.map(x=>`<button class="task" data-open="${x.it.id}" data-tab="${x.tab}"><strong>${esc(x.label)}</strong><span class="go">${esc(x.go)}</span><span class="sub">${esc(x.it.title)} · ${esc(x.why)}</span></button>`).join(''):'<p class="sub">Nothing waiting here.</p>'; };
  const running=S.items.filter(i=>i.active&&!i.needs.length&&idx(i)<S.stages.indexOf('instagram'));
  return `<div class="sec-head"><h2>Needs me</h2><span class="sub">${all.filter(x=>x.group!=='Unlinked video').length} items. Each opens the project at the step you need.</span></div>
  <div class="two"><section class="group"><h3>Production</h3>${list('Production')}</section>
  <section class="group"><h3>Publishing</h3>${list('Publishing')}<h3 style="margin-top:10px">Needs linking</h3>${list('Needs linking')}</section></div>
  ${all.some(x=>x.group==='Unlinked video')?`<details class="group"><summary><strong>${all.filter(x=>x.group==='Unlinked video').length} video projects have no linked script</strong> <span class="sub">Older experiments and test renders. Link each to its script, or remove it from the dashboard. Not counted above.</span></summary><div class="group" style="margin-top:8px">${list('Unlinked video')}</div></details>`:''}
  <section class="group"><h3>Running without you</h3>${running.map(i=>`<button class="task" data-open="${i.id}"><strong>${esc(i.title)}</strong><span class="pill run">${NAME[i.stage]}</span><span class="sub">${esc(i.note||'')}</span></button>`).join('')||'<p class="sub">Nothing is shown as in progress.</p>'}${S.queue.running?'':'<p class="sub">Job status is unavailable, so this list comes from files only. Files show outputs, not whether an agent is running right now.</p>'}</section>`; }

function vPipeline(){ const items=visible(); const gone=S.items.filter(i=>i.hidden).length, shown=S.items.length-gone, more=shown-S.items.filter(i=>i.active).length;
  return `<div class="sec-head"><h2>Pipeline</h2><span class="seg"><button data-all="0" aria-current="${!showAll}">Active</button><button data-all="1" aria-current="${showAll===true}">All (${shown})</button><button data-all="2" aria-current="${showAll==='hidden'}">Removed (${gone})</button></span></div>
  <p class="sub">${items.length} projects shown. ${showAll==='hidden'?'These are removed from every list. Open one to put it back. No file was deleted.':showAll?'All includes projects you are not interested in or not currently working on. Use Move to Active to pick one up again.':more+' more are set aside, finished or older; choose All to see them. Use Move to All to set a project aside.'}</p>
  <div class="legend"><span>Key:</span><span class="track"><span class="past">✓ Done</span><span class="need">● Waiting on you</span><span class="now">… Running</span><span class="fail">✕ Failed or blocked</span><span class="unk">? Not recorded</span><span>Not started</span><span class="nr">Not required</span></span></div>
  <div class="rows">${items.map(it=>{ const [who,txt]=nextAct(it); const w=WHO[who];
    return `<div class="pipeline-item"><button class="prow ${it.active?'':'dim'}" data-open="${it.id}"><span class="pt"><strong>${esc(it.title)}</strong><span class="mono">${esc(it.batch?it.batch.replace(/^batch-/,''):it.videoOnly?'video project':'not batched')}${it.reel?' · reel '+it.reel:''}${it.version?' · version '+it.version:''}</span></span>
    <span class="pr">${track(it)}<span class="pn"><span class="pill ${w[0]}">${w[1]}</span><span>${esc(txt)}</span></span>
    <span class="chips">${resPill(it)}${it.platforms.ig.state==='blocked'?'<span class="pill bad">Blocks Instagram</span>':''}${it.project&&it.project.finalExists?'<span class="pill ok">Final ready</span>':''}${it.unknowns.length?`<span class="pill unkp">${it.unknowns.length} not recorded</span>`:''}${it.setAside?'<span class="pill wait">Set aside</span>':''}${it.hidden?'<span class="pill wait">Hidden</span>':''}</span></span></button>${!S.remote&&!it.hidden?`<div class="row"><button class="btn small" data-activity="${it.active?'set-aside':'active'}" data-id="${it.id}">${it.active?'Move to All':'Move to Active'}</button></div>`:''}</div>`; }).join('')||'<p class="sub">Nothing to show.</p>'}</div>`; }

function vSchedule(){ const act=S.items.filter(i=>!i.hidden&&!i.videoOnly);
  const ready=act.filter(i=>i.platforms.ig.state==='ready'), blocked=act.filter(i=>i.platforms.ig.state==='blocked'), unc=act.filter(i=>i.platforms.ig.state==='unconfirmed');
  const pub=act.filter(i=>i.platforms.ig.state==='published').sort((a,b)=>new Date(b.platforms.ig.at)-new Date(a.platforms.ig.at));
  const row=(i,pill,extra)=>`<button class="ev" data-open="${i.id}" data-tab="publish">${pill}<strong>${esc(i.title)}</strong><span class="sub">${extra||''}</span></button>`;
  const sec=(t,a,f)=>`<div class="day"><h3>${t}</h3><div>${a.map(f).join('')||'<span class="sub">Nothing</span>'}</div></div>`;
  const openP=i=>['yt','tt'].some(k=>i.platforms[k].state!=='published'); const byDue=(a,b)=>new Date(a.due)-new Date(b.due);
  const openK=i=>i.platforms[i.platforms.yt.state!=='published'?'yt':'tt']; const tracked=i=>i.active&&openP(i)&&openK(i).state!=='not-recorded';
  const bucket=k=>pub.filter(i=>tracked(i)&&openK(i).bucket===k).sort(byDue);
  const older=pub.filter(i=>openP(i)&&!tracked(i)), done=pub.filter(i=>!openP(i));
  const chips=i=>['yt','tt'].map(k=>{ const st=i.platforms[k].state; return `<span class="pill ${st==='published'?'ok':st==='due'?'you':st==='not-recorded'?'unkp':'wait'}">${k==='yt'?'Shorts':'TikTok'} ${st==='published'?'posted':st==='due'?'due':st==='not-recorded'?'not recorded':'waiting'}</span>`; }).join('');
  const drow=i=>`<button class="ev" data-open="${i.id}" data-tab="publish">${chips(i)}<strong>${esc(i.title)}</strong><span class="sub">${!i.due?'file still in the Uploads root':tracked(i)?`due ${dueTxt(i.due)} · ${left(i.due)}`:'Instagram '+fmt(i.platforms.ig.at)}</span></button>`;
  return `<div class="sec-head"><h2>Publishing schedule</h2><span class="sub">All times shown in ${S.dueTimeZone}.</span></div>

// Is HyperFrames Studio answering at the recorded preview address? The page cannot know whether you watched it, only whether it can be watched now.
function probeStudio(){ const u=cur&&cur.project&&cur.project.hook&&cur.project.opening&&cur.project.opening.url; if(!u||tab!=='video'||studio[u]) return; studio[u]='checking';
  fetch(u,{mode:'no-cors',cache:'no-store'}).then(()=>{studio[u]='up';},()=>{studio[u]='down';}).then(()=>{ if(cur&&tab==='video'&&!document.querySelector('textarea:focus')) render(); }); }
const UPLOAD = {uploading:['run','Uploading to Gumroad…'],processing:['run','Uploaded; Gumroad is still processing'],'needs-check':['unkp','On Gumroad; needs checking'],uploaded:['ok','Uploaded to Gumroad'],'already-there':['ok','Already on Gumroad with the same size'],'not-applicable':['wait','Not Claude-related, so not uploaded'],'nothing-uploaded':['unkp','Nothing was uploaded; see the log'],'login-needed':['bad','Gumroad is not logged in'],held:['bad','Held: the approval did not match the file'],failed:['bad','Upload failed']};
function decisionBox(it){ const d=it.decision; const j=it.jobs.filter(x=>x.kind==='approve').pop();
  return `<div class="info">You chose Version ${esc(d.version)} on ${fmt(d.at)}. ${j?`Job ${esc(j.id)}: ${esc(j.status)}.`:'No job is running for it, so the approved file has not been written yet.'}</div>
  ${j?'':`<p class="sub">Paste this into Claude Code to finish the approval:</p>${cmd(d.command)}`}
  <div class="row"><button class="btn small" data-decide="">Change my choice</button></div>`; }
function pdfGate(it){ const r=it.resource; if(!r.pdf) return '';
  const fb=it.feedback.filter(x=>x.asset==='pdf'); const pending=fb.some(x=>x.current&&!x.started); const can=!S.remote&&(r.gate==='awaiting'||r.gate==='changed'||r.gate==='legacy'); const canUp=!S.remote&&r.gate==='approved'&&!(r.upload&&['uploading','processing','needs-check','uploaded','already-there','not-applicable'].includes(r.upload.state));
  const up=r.upload, U=up?UPLOAD[up.state]||['unkp',up.state]:null; const revJob=it.jobs.filter(x=>x.kind==='revise-pdf').pop();
  return `<iframe title="PDF preview" src="/file?p=${encodeURIComponent(r.pdf)}" style="width:100%;height:560px;border:1px solid var(--line);border-radius:8px;background:#fff"></iframe>
  ${can&&!pending&&fbOpen!=='pdf'?`<div class="row"><button class="btn primary" data-approvepdf="${esc(r.sha)}">${r.gate==='legacy'?'Record approval of this file':'Approve this file'}</button><button class="btn" data-fbopen="pdf">Request changes</button></div><p class="sub">Approval applies to this exact file (sha256 ${esc(r.sha.slice(0,12))}) and uploads nothing. If the guide is rebuilt, it asks again.${r.gate==='legacy'?' This guide was built before the approval step, so no approval is on record yet.':''}</p>`:''}
  ${canUp&&!(up&&['login-needed','failed','held','nothing-uploaded'].includes(up.state))?`<div class="row"><button class="btn" data-uploadpdf="${esc(r.sha)}">Upload to Gumroad</button><span class="sub">A separate step. It sends this approved file to your Gumroad product; a file already there with the same size is skipped.</span></div>`:''}
  ${can&&fbOpen==='pdf'?`<label class="sub" for="fbtext">What should change in this version?</label><textarea id="fbtext" rows="3" style="width:100%;max-width:560px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px" placeholder="For example: step 3 needs the exact menu name"></textarea><div class="row"><button class="btn small primary" data-fbsave="1">Record feedback</button><button class="btn small" data-fbopen="">Cancel</button></div>`:''}
  ${fb.map(x=>`<div class="${x.current?'info':'unknown'}">Feedback on version ${esc(x.version.slice(0,12))}${x.current?'':' (an earlier build)'}: "${esc(x.text)}". ${x.started?'Revision started '+fmt(x.started)+'.':'No work has started.'}</div>
    ${x.current&&!x.started?`<div class="row"><button class="btn small primary" data-startrev="${x.index}">Start revision</button><button class="btn small" data-withdraw="${x.index}">Withdraw feedback</button><span class="sub">Starting is a separate step, so nothing runs until you say so.</span></div>`:''}
    ${x.current&&x.started?(revJob?`<p class="sub">Job ${esc(revJob.id)}: ${esc(revJob.status)}. The rebuilt PDF will ask for approval again.</p>`:`<p class="sub">No job was queued. Paste this into Claude Code to do the revision:</p>${cmd(x.command)}`):''}`).join('')}
  ${up?`<div class="row"><strong>Gumroad</strong><span class="pill ${U[0]}">${U[1]}</span>${up.at?`<span class="sub">${fmt(up.at)}</span>`:''}${!S.remote&&r.gate==='approved'&&['processing','needs-check'].includes(up.state)?`<button class="btn small" data-checkupload="${esc(r.sha)}">Check upload status</button>`:''}${!S.remote&&['login-needed','failed','held','nothing-uploaded'].includes(up.state)?'<button class="btn small" data-retryupload="1">Try the upload again</button>':''}</div>
    ${up.state==='login-needed'?'<p class="sub">In a terminal, run: gumroad auth login. Approve it in the browser, then try again.</p>':''}
    ${up.log?`<details><summary class="sub">Upload log</summary><div class="script">${esc(up.log)}</div></details>`:''}`:''}`; }
function gateText(r){ if(!r.pdf) return 'No PDF yet'; return {approved:'Approved '+fmt(r.approvedAt),changed:'Rebuilt since it was approved; needs a new approval',awaiting:'Awaiting your approval',legacy:'Not recorded (built before the approval step)'}[r.gate]||'Unknown'; }

function vProject(){ const it=cur; const i=idx(it); const dots=new Set(it.needs.map(n=>n.tab));
  const tabs=[['scripts','Scripts'],['resource','Resource'],['recording','Recording'],['video','Video'],['publish','Publish']];
  const body={scripts:tScripts,resource:tResource,recording:tRecording,video:tVideo,publish:tPublish}[tab](it); const [who,txt]=nextAct(it); const w=WHO[who];
  return `<div class="row" style="justify-content:space-between"><button class="back" data-view="${view}">Back to ${view==='attention'?'Needs me':view==='pipeline'?'Pipeline':'Schedule'}</button><button class="btn small" data-hide="${it.hidden?0:1}" title="Only the dashboard's own note changes. No file is deleted.">${it.hidden?'Put back in the dashboard':'Remove from the dashboard'}</button></div>
  <div class="sec-head"><div><h2>${esc(it.title)}</h2><div class="mono">${esc(it.id)}${it.batch?' · '+esc(it.batch):''}${it.version?' · version '+it.version:''}${it.project?' · video-projects/'+esc(it.project.slug):''}</div></div></div>
  ${track(it)}<div class="pn"><span class="pill ${w[0]}">${w[1]}</span><span>${esc(txt)}</span></div>
  ${it.unknowns.length?`<div class="unknown"><strong>Not recorded</strong><ul>${it.unknowns.map(u=>`<li>${esc(u)}</li>`).join('')}</ul></div>`:''}
  <div class="tabs">${tabs.map(([k,l])=>`<button data-tab-go="${k}" aria-current="${tab===k}">${l}${dots.has(k)?'<span class="dot" title="Needs you"></span>':''}</button>`).join('')}</div>${body}`; }

function render(){ if(!S) return; renderNav(); const tick=document.getElementById('hooktick'), was=tick&&tick.checked; $('#app').innerHTML = cur ? vProject() : view==='pipeline' ? vPipeline() : view==='schedule' ? vSchedule() : vAttention();
  const t2=document.getElementById('hooktick'); if(t2&&was) t2.checked=true; probeStudio(); }

document.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const d=b.dataset;
  if(d.view){ view=d.view; cur=null; pubOpen=null; liveOpen=false; render(); }
  else if(d.open){ open(d.open,d.tab); }
  else if(d.tabGo){ tab=d.tabGo; render(); }
  else if(d.all!==undefined){ showAll=d.all==='2'?'hidden':d.all==='1'; render(); }
  else if(d.activity){ act({id:d.id,type:'activity',activity:d.activity},d.activity==='set-aside'?'Moved to All. You can move it back to Active anytime.':'Moved to Active'); }
  else if(d.copy!==undefined){ copyText(d.copy).then(()=>toast('Copied'),()=>toast('Copy was blocked; select the text instead')); }
  else if(d.task){ act({id:cur.id,type:'task',task:d.task,done:d.done==='1'},d.done==='1'?'Marked as done':'Marked as not done'); }
  else if(d.linkval){ act({id:cur.id,type:'link',kind:d.linkval,value:d.val},'Linked'); }
  else if(d.decide!==undefined){ act({id:cur.id,type:'decide',version:d.decide||null}); }
  else if(d.approvepdf){ act({id:cur.id,type:'approve-pdf',sha:d.approvepdf}); }
  else if(d.checkupload){ act({id:cur.id,type:'check-upload',sha:d.checkupload}); }
  else if(d.fbopen!==undefined){ fbOpen=d.fbopen||false; render(); const t=document.getElementById('fbtext'); if(t) t.focus(); }
  else if(d.fbsave){ const t=document.getElementById('fbtext'), asset=fbOpen; fbOpen=false; act({id:cur.id,type:'feedback',asset,text:t?t.value:''}); }
  else if(d.approvehook){ const t=document.getElementById('hooktick'); if(!(t&&t.checked)){ toast('Tick "I have watched this opening" first'); return; } act({id:cur.id,type:'approve-hook',fingerprint:d.approvehook,watched:true}); }
  else if(d.approvecand){ act({id:cur.id,type:'approve-candidate',sha:d.approvecand}); }
  else if(d.startrev!==undefined){ act({id:cur.id,type:'start-revision',index:Number(d.startrev)}); }
  else if(d.withdraw!==undefined){ act({id:cur.id,type:'withdraw-feedback',index:Number(d.withdraw)}); }
  else if(d.retryupload){ act({id:cur.id,type:'retry-upload'}); }
  else if(d.uploadpdf){ act({id:cur.id,type:'upload-pdf',sha:d.uploadpdf}); }
  else if(d.pubopen!==undefined){ pubOpen=d.pubopen||null; render(); const t=document.getElementById('puburl'); if(t) t.focus(); }
  else if(d.pubsave){ const at=document.getElementById('pubat').value, url=document.getElementById('puburl').value; if(!at){ toast('Enter the time it was published'); return; } pubOpen=null; act({id:cur.id,type:'publish',platform:PL[d.pubsave][0],at:new Date(at).toISOString(),url}); }
  else if(d.unpub){ act({id:cur.id,type:'unpublish',platform:d.unpub}); }
  else if(d.confirmpost){ act({id:cur.id,type:'confirm-post',key:d.confirmpost}); }
  else if(d.liveopen!==undefined){ liveOpen=d.liveopen==='1'; render(); }
  else if(d.resstatus){ const t=document.getElementById('livetick'); if(d.resstatus==='live'&&!(t&&t.checked)){ toast('Tick the box first'); return; } liveOpen=false; act({id:cur.id,type:'resource-status',keyword:cur.resource.keyword,to:d.resstatus,confirmed:d.resstatus==='live'}); }
  else if(d.hide!==undefined){ act({id:cur.id,type:'hide',hidden:d.hide==='1'},d.hide==='1'?'Removed from every list. No file was deleted. Find it under Pipeline, Removed.':'Back in the dashboard'); } });
document.addEventListener('change',e=>{ const s=e.target.closest('select[data-link]'); if(s&&cur) act({id:cur.id,type:'link',kind:s.dataset.link,value:s.value||null},s.value?'Linked':'Link removed'); });
setInterval(()=>{ if(cur&&cur.resource.upload&&cur.resource.upload.state==='uploading') load(true); },3000);
load(); setInterval(()=>{ const v=[...document.querySelectorAll('video,audio')].find(x=>!x.paused)||(fbOpen||pubOpen||liveOpen?1:null)||(cur&&tab==='resource'&&cur.resource.pdf&&!(cur.resource.upload&&cur.resource.upload.state==='uploading')?1:null); if(!document.hidden&&!document.querySelector('select:focus,input:focus,textarea:focus')&&!(v&&!v.paused)) load(true); },30000);
</script>
