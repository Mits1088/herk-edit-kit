<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Content Command Centre</title>
<script>/* Light unless you chose Dark or Auto (follow Windows). Set before the first paint so the page never flashes. */ (function(){ let t='light'; try{ t=localStorage.getItem('cc-theme')||'light'; }catch(_){} if(t!=='auto') document.documentElement.dataset.theme=t==='dark'?'dark':'light'; })();</script>
<link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/research.css">
<link rel="stylesheet" href="/publish.css">
</head>
<body>
<div class="shell">
<aside class="rail">
  <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M4 8h16M4 16h16M9 3v5M15 3v5M9 16v5M15 16v5"/></svg></span><div><h1>Content Command Centre</h1><small>Reels pipeline</small></div></div>
  <nav class="nav" id="nav" aria-label="Views"></nav>
  <div class="rail-foot">
    <div class="sync" id="status" role="status"><span class="s1"><span class="live off"></span>Loading…</span></div>
    <div class="theme" role="group" aria-label="Theme">
      <button type="button" data-theme-set="light" aria-pressed="false" title="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg><span>Light</span></button>
      <button type="button" data-theme-set="dark" aria-pressed="false" title="Dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg><span>Dark</span></button>
      <button type="button" data-theme-set="auto" aria-pressed="false" title="Follow Windows"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>Auto</span></button>
    </div>
  </div>
</aside>
<div class="wrap">
  <div class="topbar"><nav class="crumbs" id="crumbs" aria-label="You are here"></nav></div>
  <main id="app"></main>
</div>
</div>
<div id="toast" role="status" hidden></div>
<script src="/icons.js"></script>
<script src="/research.js"></script>
<script src="/publish.js"></script>
<script>
let S = null, view = 'attention', cur = null, tab = 'scripts', detail = null, showAll = false, pubOpen = null, liveOpen = false;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = d => d ? new Date(d).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:S&&S.dueTimeZone||undefined}) : '';
const dueTxt = d => fmt(d)+(S.dueProvisional?' (provisional)':'');
const tzNote = () => `${String(S.dueHour).padStart(2,'0')}:00 ${S.dueTimeZone}`;
const NAME = {source:'Source received',rewrite:'Rewriting',choose:'Choose script',record:'Record voiceover',avatar:'HeyGen avatar',hook:'Hook review',build:'Building',render:'Rendering candidate',qa:'QA',candidate:'Approve candidate',instagram:'Instagram',distribute:'Shorts and TikTok',done:'Done'};
const TR = [['source','Source'],['rewrite','Rewrite'],['choose','Script'],['record','Voice'],['avatar','Avatar'],['hook','Hook'],['build','Build'],['render','Render'],['qa','QA'],['candidate','Approve candidate'],['instagram','Instagram'],['yt','Shorts'],['tt','TikTok']];
const MARK = {past:'✓ ',need:'● ',now:'… ',fail:'✕ ',unk:'? '};
const RES = {'not-required':['','PDF not required'],pending:['wait','PDF decided at approval'],unknown:['unkp','PDF unknown'],'not-built':['you','PDF not built'],draft:['run','PDF built, not live'],live:['ok','PDF live']};
const idx = it => S.stages.indexOf(it.stage);
const visible = () => S.items.filter(i => showAll==='hidden' ? i.hidden : showAll ? !i.hidden : i.active);
const left = d => { const h = Math.round((new Date(d) - Date.now())/3600e3); if (h <= 0) { const a = -h; return a < 24 ? `due ${a} h ago` : `overdue by ${Math.floor(a/24)} d`; } return h < 24 ? `in ${h} h` : `in ${Math.floor(h/24)} d ${h%24} h`; };

// navigator.clipboard needs https or localhost, so a phone on the home network uses the older copy command.
function copyText(t){ if(navigator.clipboard&&window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise((ok,no)=>{ const a=document.createElement('textarea'); a.value=t; a.setAttribute('readonly',''); a.style.cssText='position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(a); a.select(); a.setSelectionRange(0,t.length); let r=false; try{ r=document.execCommand('copy'); }catch(_){} a.remove(); r?ok():no(); }); }
const nowLocal = () => new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,m.length>80?12000:3500); }
async function refreshDetail(){ if(!cur) return; const id=cur.id; try{ const r=await fetch('/api/item?id='+encodeURIComponent(id)); const d=await r.json(); if(cur&&cur.id===id){ detail=d; render(); } }catch(_){} }
async function load(quiet){ try{ const r=await fetch('/api/state'); S=await r.json(); if(cur){ cur=S.items.find(i=>i.id===cur.id)||null; if(!cur) view='attention'; }
    // The Publish tab shows the approved file from the item detail; fetch it again when the approval moved on.
    if(cur&&detail&&detail.video&&cur.project&&cur.project.approval&&cur.project.approval.sha!==detail.video.sha) refreshDetail();
    const q=S.queue, on=q.available&&q.running;
    $('#status').innerHTML=`<span class="s1"><span class="live${on?'':' off'}"></span>Read from your files at ${new Date(S.generatedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span><span class="m">${on?'Job queue: '+q.missions.length+' jobs':'Job status unavailable ('+esc(q.reason)+')'}</span><span class="m why">It reads your workflow files and changes one only when a button says so.</span>${S.remote?'<span class="m">Phone view: copy captions, download the video and record what you published. Everything else stays on the PC.</span>':''}${S.warnings.length?'<span class="warn">Warnings: '+esc(S.warnings.join('; '))+'</span>':''}`;
    render(); }catch(e){ if(!quiet) $('#status').innerHTML='<span class="warn">Could not read state: '+esc(e.message)+'</span>'; } }
async function act(a,msg){ const r=await fetch('/api/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(a)}); const j=await r.json(); if(!r.ok){ toast(j.error||'That did not work'); return; } toast(j.message&&j.message!=='Saved'?j.message:(msg||'Saved')); await load(); if(/^approve-|^restore-/.test(a.type||'')) await refreshDetail(); }
async function open(id,t){ cur=S.items.find(i=>i.id===id); if(!cur) return; extSel=''; extTick=false; extSrc=''; tab=t||(cur.needs[0]||{}).tab||'scripts'; detail=null; pubOpen=null; liveOpen=false; fbOpen=false; studio={}; render(); window.scrollTo(0,0);
  try{ const r=await fetch('/api/item?id='+encodeURIComponent(id)); detail=await r.json(); if(cur&&cur.id===id) render(); }catch(_){} }

// The reel strip: the 13 stages drawn as one strip in four phases. Each stage keeps its text (✓ Source …) for
// screen readers, tooltips and the full strip on the project page; the compact strip shows coloured frames only.
const PHASES = [['Write','--p-write',3],['Make','--p-make',5],['Check','--p-check',2],['Ship','--p-ship',3]];
const STATE_WORD = {past:'done',need:'waiting on you',now:'running',fail:'failed or blocked',unk:'not recorded'};
function track(it,full){ const frames=stageFrames(it); let at=0;
  return `<span class="track strip${full?' full':''}">${PHASES.map(([name,c,n])=>{ const f=frames.slice(at,at+=n);
    return `<span class="ph" style="--c:var(${c})"><small>${name}</small><span class="frs">${f.join('')}</span></span>`; }).join('')}</span>`; }
function stageFrames(it){ const i=idx(it); const need=it.needs.some(n=>n.group==='Production'||n.group==='Publishing');
  return TR.map(([k,l])=>{ let c='';
    if(k==='yt'||k==='tt'){ const st=it.platforms[k].state; c=st==='published'?'past':st==='due'?'need':st==='not-recorded'?'unk':''; }
    else if(k==='instagram'){ const st=it.platforms.ig.state; c=st==='published'?'past':st==='blocked'?'fail':st==='ready'?'need':(st==='unconfirmed'||st==='unknown')?'unk':''; }
    else { const j=S.stages.indexOf(k); c=j<i?(it.videoOnly&&j<=2?'unk':'past'):j===i?(it.fail?'fail':need?'need':it.dormant?'unk':'now'):''; }
    return `<span class="${c}" title="${l}${STATE_WORD[c]?': '+STATE_WORD[c]:''}">${MARK[c]||''}${l}</span>`; }); }
function nextAct(it){ const n=it.needs.filter(x=>x.group==='Production'||x.group==='Publishing');
  if(it.setAside) return ['Idle','Set aside: not currently working on this'];
  if(it.fail) return ['You','Recover: '+it.fail];
  if(n.length) return ['You',n.map(x=>x.label).join(' + ')];
  if(it.needs.length) return ['Link',it.needs.map(x=>x.label).join(' + ')];
  if(it.dormant) return ['Idle',it.note||'Set aside'];
  if(it.stage==='done') return ['Done','Published on Instagram, Shorts and TikTok'];
  if(it.stage==='distribute'&&['yt','tt'].some(k=>it.platforms[k].state==='not-recorded')) return ['Unknown','Shorts and TikTok: posted before the dashboard recorded them'];
  if(it.stage==='distribute') return ['Wait',`Shorts and TikTok fall due ${dueTxt(it.due)}`];
  return ['System',it.note||NAME[it.stage]]; }
const WHO = {You:['you','Next: You'],Link:['you','Needs linking'],Idle:['wait','Idle'],Unknown:['unkp','Not recorded'],Wait:['wait','Waiting for the date'],Done:['ok','Complete'],System:['run','Next: System']};
function resPill(it){ const g=it.resource.gate; if(it.resource.state!=='live'&&(g==='awaiting'||g==='changed')) return `<span class="pill you">PDF awaiting your approval · ${esc(it.resource.keyword)}</span>`;
  if(it.resource.state!=='live'&&g==='approved') return `<span class="pill run">PDF approved, not live · ${esc(it.resource.keyword)}</span>`;
  const r=RES[it.resource.state]||['unkp','PDF unknown']; return r[0]?`<span class="pill ${r[0]}">${r[1]}${it.resource.keyword?' · '+esc(it.resource.keyword):''}</span>`:`<span class="track"><span class="nr">${r[1]}</span></span>`; }

const ICON = { attention:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', pipeline:'<path d="M4 6h16M4 12h16M4 18h10"/>', schedule:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>', research:'<circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/>', insights:'<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>' };
const VIEW = { attention:'Needs me', pipeline:'Pipeline', schedule:'Schedule', research:'Research', insights:'Insights' };
function renderNav(){ const n=S.items.filter(i=>i.active).reduce((a,i)=>a+i.needs.filter(x=>x.group!=='Unlinked video').length,0);
  const live=S.items.filter(i=>i.active).length, sched=S.items.filter(i=>!i.hidden&&!i.videoOnly&&(i.platforms.ig.state==='ready'||(i.active&&['yt','tt'].some(k=>i.platforms[k].state==='due')))).length;
  const extra={attention:`<span class="count">${n}</span>`,pipeline:`<span class="q">${live}</span>`,schedule:sched?`<span class="q">${sched} to post</span>`:''};
  document.title=(n?`(${n}) `:'')+'Content Command Centre';
  $('#nav').innerHTML=Object.keys(VIEW).map(k=>`<button data-view="${k}" aria-current="${view===k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>${VIEW[k]} ${extra[k]||''}</button>`).join(''); }
// A reel's little cover takes the colours of the phase it is in and the one after it.
function thumbHue(it){ const p=['--p-write','--p-make','--p-check','--p-ship']; const s=Math.max(0,idx(it)); const ph=s<3?0:s<8?1:s<10?2:3; return `--c1:var(${p[ph]});--c2:var(${p[(ph+1)%4]})`; }
function renderCrumbs(){ const c=$('#crumbs'); if(!c) return; const sep='<span class="sep" aria-hidden="true">/</span>';
  c.innerHTML=cur?`<span>${VIEW[view]}</span>${sep}<b>${esc(cur.title)}</b>${sep}<span>${esc({scripts:'Scripts',resource:'Resource',recording:'Recording',video:'Video',publish:'Publish'}[tab]||'')}</span>`:`<b>${VIEW[view]}</b>`; }
function themeButtons(){ let t='light'; try{ t=localStorage.getItem('cc-theme')||'light'; }catch(_){} document.querySelectorAll('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeSet===t))); }
function setTheme(t){ try{ localStorage.setItem('cc-theme',t); }catch(_){} if(t==='auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=t; themeButtons(); }
themeButtons();

function vAttention(){ const all=S.items.filter(i=>i.active).flatMap(i=>i.needs.map(n=>({...n,it:i})));
  const taskBtn=x=>`<button class="task" data-open="${x.it.id}" data-tab="${x.tab}"><strong>${esc(x.label)}</strong><span class="go">${esc(x.go)}</span><span class="sub">${esc(x.why)}</span></button>`;
  // One card per reel, its tasks listed underneath, in the order the first task appeared.
  const list=g=>{ const a=all.filter(x=>x.group===g); if(!a.length) return '<p class="empty">Nothing waiting here.</p>';
    const by=new Map(); a.forEach(x=>{ if(!by.has(x.it.id)) by.set(x.it.id,[]); by.get(x.it.id).push(x); });
    return [...by.values()].map(ts=>{ const it=ts[0].it; const meta=it.batch?it.batch.replace(/^batch-/,'')+(it.reel?' · reel '+it.reel:'')+(it.version?' · version '+it.version:''):it.videoOnly?'video project':'';
      const pill=g==='Unlinked video'?'':it.fail?'<span class="pill bad">Blocked</span>':`<span class="pill you">${ts.length>1?ts.length+' on you':'On you'}</span>`;
      return `<article class="reel" aria-label="${esc(it.title)}"><div class="reel-h"><span class="thumb" aria-hidden="true" style="${thumbHue(it)}"></span><strong>${esc(it.title)}</strong>${pill}<span class="mono">${esc(meta)}</span>${it.videoOnly?'':track(it)}</div>${ts.map(taskBtn).join('')}</article>`; }).join(''); };
  const running=S.items.filter(i=>i.active&&!i.needs.length&&idx(i)<S.stages.indexOf('instagram'));
  const cnt=g=>all.filter(x=>x.group===g).length, nT=all.filter(x=>x.group!=='Unlinked video'), nR=new Set(nT.map(x=>x.it.id)).size;
  return `<div class="sec-head"><div><h2>Needs me</h2><p class="sub">${nT.length} items across ${nR} ${nR===1?'reel':'reels'}. Each opens the project at the step you need.</p></div></div>
  ${(()=>{ const prod=`<section class="group"><h3>Production <em class="lane-n">${cnt('Production')}</em></h3>${list('Production')}</section>`,
    pub=`<section class="group"><h3>Publishing <em class="lane-n">${cnt('Publishing')}</em></h3>${list('Publishing')}<h3 style="margin-top:12px">Needs linking <em class="lane-n">${cnt('Needs linking')}</em></h3>${list('Needs linking')}</section>`;
    // the busier lane takes the wide column
    return `<div class="two">${cnt('Production')>=cnt('Publishing')+cnt('Needs linking')?prod+pub:pub+prod}</div>`; })()}
  ${all.some(x=>x.group==='Unlinked video')?`<details class="group"><summary><strong>${all.filter(x=>x.group==='Unlinked video').length} video projects have no linked script</strong> <span class="sub">Older experiments and test renders. Link each to its script, or remove it from the dashboard. Not counted above.</span></summary><div class="group" style="margin-top:8px">${list('Unlinked video')}</div></details>`:''}
  <section class="group"><h3>Running without you <em class="lane-n">${running.length}</em></h3>${running.map(i=>`<button class="task" data-open="${i.id}"><strong>${esc(i.title)}</strong><span class="pill run">${NAME[i.stage]}</span><span class="sub">${esc(i.note||'')}</span></button>`).join('')||'<p class="empty">Nothing is shown as in progress.</p>'}${S.queue.running?'':'<p class="sub">Job status is unavailable, so this list comes from files only. Files show outputs, not whether an agent is running right now.</p>'}</section>`; }

function vPipeline(){ const items=visible(); const gone=S.items.filter(i=>i.hidden).length, shown=S.items.length-gone, more=shown-S.items.filter(i=>i.active).length;
  return `<div class="sec-head"><h2>Pipeline</h2><span class="seg"><button data-all="0" aria-current="${!showAll}">Active</button><button data-all="1" aria-current="${showAll===true}">All (${shown})</button><button data-all="2" aria-current="${showAll==='hidden'}">Removed (${gone})</button></span></div>
  <p class="sub">${items.length} projects shown. ${showAll==='hidden'?'These are removed from every list. Open one to put it back. No file was deleted.':showAll?'All includes projects you are not interested in or not currently working on. Use Move to Active to pick one up again.':more+' more are set aside, finished or older; choose All to see them. Use Move to All to set a project aside.'}</p>
  <div class="legend"><span>Key:</span><span class="phase-key"><span style="color:var(--p-write)">Write</span><span style="color:var(--p-make)">Make</span><span style="color:var(--p-check)">Check</span><span style="color:var(--p-ship)">Ship</span></span><span class="strip-key"><i class="past"></i>Done</span><span class="strip-key"><i class="need"></i>Waiting on you</span><span class="strip-key"><i class="now"></i>Running</span><span class="strip-key"><i class="fail"></i>Failed or blocked</span><span class="strip-key"><i class="unk"></i>Not recorded or not required</span><span class="strip-key"><i></i>Not started</span><span class="sub">Hover a frame for its stage.</span></div>
  <div class="rows">${items.map(it=>{ const [who,txt]=nextAct(it); const w=WHO[who];
    return `<div class="pipeline-item"><button class="prow ${it.active?'':'dim'}" data-open="${it.id}"><span class="pt"><strong>${esc(it.title)}</strong><span class="mono">${esc(it.batch?it.batch.replace(/^batch-/,''):it.videoOnly?'video project':'not batched')}${it.reel?' · reel '+it.reel:''}${it.version?' · version '+it.version:''}</span></span>
    <span class="pr">${track(it)}<span class="pn"><span class="pill ${w[0]}">${w[1]}</span><span>${esc(txt)}</span></span>
    <span class="chips">${resPill(it)}${it.platforms.ig.state==='blocked'?'<span class="pill bad">Blocks Instagram</span>':''}${it.project&&it.project.finalExists?'<span class="pill ok">Final ready</span>':''}${it.unknowns.length?`<span class="pill unkp">${it.unknowns.length} not recorded</span>`:''}${it.setAside?'<span class="pill wait">Set aside</span>':''}${it.hidden?'<span class="pill wait">Hidden</span>':''}</span></span></button>${!S.remote&&!it.hidden?`<div class="row"><button class="btn small" data-activity="${it.active?'set-aside':'active'}" data-id="${it.id}">${it.active?'Move to All':'Move to Active'}</button></div>`:''}</div>`; }).join('')||'<p class="sub">Nothing to show.</p>'}</div>`; }

function vSchedule(){ const act=S.items.filter(i=>!i.hidden&&!i.videoOnly);
  const ready=act.filter(i=>i.platforms.ig.state==='ready'), blocked=act.filter(i=>i.platforms.ig.state==='blocked'), unc=act.filter(i=>i.platforms.ig.state==='unconfirmed');
  const pub=act.filter(i=>i.platforms.ig.state==='published').sort((a,b)=>new Date(b.platforms.ig.at)-new Date(a.platforms.ig.at));
  const row=(i,pill,extra)=>`<button class="ev" data-open="${i.id}" data-tab="publish">${pill}<strong>${esc(i.title)}</strong><span class="sub">${extra||''}</span></button>`;
  const sec=(t,a,f)=>`<div class="day"><h3>${t}</h3><div>${a.map(f).join('')||'<span class="sub">Nothing</span>'}</div></div>`;
  const openP=i=>['yt','tt'].some(k=>i.platforms[k].state!=='published'); const byDue=(a,b)=>new Date(a.due)-new Date(b.due);
  const openK=i=>i.platforms[i.platforms.yt.state!=='published'?'yt':'tt']; const tracked=i=>i.active&&openP(i)&&openK(i).state!=='not-recorded';
  const bucket=k=>pub.filter(i=>tracked(i)&&openK(i).bucket===k).sort(byDue);
  const older=pub.filter(i=>openP(i)&&!tracked(i)), done=pub.filter(i=>!openP(i));
  const chips=i=>['yt','tt'].map(k=>{ const st=i.platforms[k].state; return `<span class="pill ${st==='published'?'ok':st==='due'?'you':st==='not-recorded'?'unkp':'wait'}">${k==='yt'?'Shorts':'TikTok'} ${st==='published'?'posted':st==='due'?'due':st==='not-recorded'?'not recorded':'waiting'}</span>`; }).join('');
  const drow=i=>`<button class="ev" data-open="${i.id}" data-tab="publish">${chips(i)}<strong>${esc(i.title)}</strong><span class="sub">${!i.due?'file still in the Uploads root':tracked(i)?`due ${dueTxt(i.due)} · ${left(i.due)}`:'Instagram '+fmt(i.platforms.ig.at)}</span></button>`;
  return `<div class="sec-head"><h2>Publishing schedule</h2><span class="sub">All times shown in ${S.dueTimeZone}.</span></div>
  ${!S.dueDays?'<p class="sub">Shorts and TikTok fall due as soon as the Instagram post is recorded.</p>':S.dueProvisional?`<div class="unknown"><strong>Due dates are provisional.</strong> They assume calendar day ${S.dueDays} after the confirmed Instagram post, at ${tzNote()}. You have not confirmed that time or timezone yet. Set DASH_DUE_HOUR and DASH_TZ, then DASH_DUE_CONFIRMED=1.</div>`:`<p class="sub">Shorts and TikTok fall due at ${tzNote()} on calendar day ${S.dueDays} after the confirmed Instagram post.</p>`}
  <div class="panel">${sec('Ready for Instagram',ready,i=>row(i,'<span class="pill you">Ready to post</span>'))}
  ${sec('Blocked',blocked,i=>row(i,'<span class="pill bad">Resource not live</span>','keyword '+esc(i.resource.keyword)))}
  ${sec('Possible posts to confirm',unc,i=>row(i,'<span class="pill unkp">Unconfirmed</span>',fmt(i.platforms.ig.at)))}</div>
  <div class="sec-head"><h2>Shorts and TikTok</h2><span class="sub">Each platform is recorded on its own. "Due" means no post is recorded here.</span></div>
  <div class="panel">${sec('Overdue',bucket('overdue'),drow)}${sec('Due today',bucket('today'),drow)}${sec('Upcoming',bucket('upcoming'),drow)}
  ${sec('Published everywhere',done,i=>row(i,'<span class="pill ok">Complete</span>',i.platforms.ig.at?'Instagram '+fmt(i.platforms.ig.at):'per the Uploads folder'))}</div>

  const rows=IN.reels.map(r=>{ const it=byUrl.get(r.url); const d=r.viewsBefore!=null&&r.views!=null&&r.views>r.viewsBefore?'<span class="up">+'+num(r.views-r.viewsBefore)+' since '+fmt(IN.previousAt)+'</span>':'';

// A short fade when you move to another view, project or tab; the 30-second reloads redraw without it.

  else if(d.back){ const r=ret; cur=null; ret=null; pubOpen=null; liveOpen=false; render(); if(r&&view!=='research'){ const row=[...document.querySelectorAll('[data-open]')].find(x=>x.dataset.open===r.id&&(x.dataset.tab||'')===r.tab)||document.querySelector(`[data-open="${CSS.escape(r.id)}"]`); if(row){ const h=row.closest('details'); if(h) h.open=true; row.focus({preventScroll:true}); } window.scrollTo(0,r.y); } }

  else if(d.tabGo){ tab=d.tabGo; render(); }
  else if(d.all!==undefined){ showAll=d.all==='2'?'hidden':d.all==='1'; render(); }
  else if(d.activity){ act({id:d.id,type:'activity',activity:d.activity},d.activity==='set-aside'?'Moved to All. You can move it back to Active anytime.':'Moved to Active'); }
  else if(d.copy!==undefined){ copyText(d.copy).then(()=>toast('Copied'),()=>toast('Copy was blocked; select the text instead')); }
  else if(d.task){ act({id:cur.id,type:'task',task:d.task,done:d.done==='1'},d.done==='1'?'Marked as done':'Marked as not done'); }
  else if(d.linkval){ act({id:cur.id,type:'link',kind:d.linkval,value:d.val},'Linked'); }
  else if(d.decide!==undefined){ act({id:cur.id,type:'decide',version:d.decide||null}).then(refreshDetail); }
  else if(d.vcsave){ const id=cur.id; act({id,type:'version-c',text:vc.text}).then(refreshDetail); }
  else if(d.vcapprove){ const id=cur.id; (async()=>{ if(vc.text!==vcSaved(detail)){ const r=await fetch('/api/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,type:'version-c',text:vc.text})}); if(!r.ok){ const j=await r.json().catch(()=>({})); toast(j.error||'Version C could not be saved, so nothing was approved'); return; } }
      await act({id,type:'decide',version:'C'}); await refreshDetail(); })(); }
  else if(d.vcclear){ if(vc.text.trim()&&!confirm('Clear Version C? It stays saved on file until you press Save.')) return; const t='';
    vc.text=t; render(); }
  else if(d.approvepdf){ act({id:cur.id,type:'approve-pdf',sha:d.approvepdf}); }
  else if(d.checkupload){ act({id:cur.id,type:'check-upload',sha:d.checkupload}); }
  else if(d.fbopen!==undefined){ fbOpen=d.fbopen||false; render(); const t=document.getElementById('fbtext'); if(t) t.focus(); }
  else if(d.fbsave){ const t=document.getElementById('fbtext'), asset=fbOpen; fbOpen=false; act({id:cur.id,type:'feedback',asset,text:t?t.value:''}); }
  else if(d.approvehook){ const t=document.getElementById('hooktick'); if(!(t&&t.checked)){ toast('Tick "I have watched this opening" first'); return; } act({id:cur.id,type:'approve-hook',fingerprint:d.approvehook,watched:true}); }
  else if(d.approveext){ if(!extTick){ toast('Tick "I watched and listened to this exact file" first'); return; } extBusy=true; render(); act({id:cur.id,type:'approve-external',file:extSel,sha:d.approveext,source:extSrc,watched:true}).finally(()=>{ extBusy=false; extSel=''; extTick=false; render(); }); }
  else if(d.restoreext){ act({id:cur.id,type:'restore-external'}); }
  else if(d.approvecand){ act({id:cur.id,type:'approve-candidate',sha:d.approvecand}); }
  else if(d.startrev!==undefined){ act({id:cur.id,type:'start-revision',index:Number(d.startrev)}); }
  else if(d.withdraw!==undefined){ act({id:cur.id,type:'withdraw-feedback',index:Number(d.withdraw)}); }
  else if(d.retryupload){ act({id:cur.id,type:'retry-upload'}); }
  else if(d.uploadpdf){ act({id:cur.id,type:'upload-pdf',sha:d.uploadpdf}); }
  else if(d.pubopen!==undefined){ pubOpen=d.pubopen||null; render(); const t=document.getElementById('puburl'); if(t) t.focus(); }
  else if(d.pubsave){ const at=document.getElementById('pubat').value, url=document.getElementById('puburl').value; if(!at){ toast('Enter the time it was published'); return; } pubOpen=null; act({id:cur.id,type:'publish',platform:PL[d.pubsave][0],at:new Date(at).toISOString(),url}); }
  else if(d.unpub){ act({id:cur.id,type:'unpublish',platform:d.unpub}); }
  else if(d.confirmpost){ act({id:cur.id,type:'confirm-post',key:d.confirmpost}); }
  else if(d.liveopen!==undefined){ liveOpen=d.liveopen==='1'; render(); }
  else if(d.resstatus){ const t=document.getElementById('livetick'); if(d.resstatus==='live'&&!(t&&t.checked)){ toast('Tick the box first'); return; } liveOpen=false; act({id:cur.id,type:'resource-status',keyword:cur.resource.keyword,to:d.resstatus,confirmed:d.resstatus==='live'}); }
  else if(d.hide!==undefined){ act({id:cur.id,type:'hide',hidden:d.hide==='1'},d.hide==='1'?'Removed from every list. No file was deleted. Find it under Pipeline, Removed.':'Back in the dashboard'); } });
document.addEventListener('input',e=>{ if(e.target.id==='extsrc') extSrc=e.target.value;
  if(e.target.id==='vctext'){ vc.text=e.target.value; const s=vcSaved(detail)!==vc.text; const b=document.querySelector('[data-vcapprove]'); if(b) b.hidden=!vc.text.trim(); const c=document.querySelector('[data-vcclear]'); if(c) c.hidden=!vc.text; const p=document.getElementById('vcdirty'); if(p) p.hidden=!s; } });
document.addEventListener('change',e=>{ if(e.target.id==='insreport'){ insReport=e.target.value; drawInsights(); return; } if(e.target.id==='extsel'){ extSel=e.target.value; extTick=false; render(); return; } if(e.target.id==='exttick'){ extTick=e.target.checked; const b=document.querySelector('[data-approveext]'); if(b) b.disabled=!extTick||extBusy; return; } const s=e.target.closest('select[data-link]'); if(s&&cur) act({id:cur.id,type:'link',kind:s.dataset.link,value:s.value||null},s.value?'Linked':'Link removed'); });
setInterval(()=>{ if(cur&&cur.resource.upload&&cur.resource.upload.state==='uploading') load(true); },3000);
load(); setInterval(()=>{ const v=[...document.querySelectorAll('video,audio')].find(x=>!x.paused)||(fbOpen||pubOpen||liveOpen?1:null)||(cur&&tab==='resource'&&cur.resource.pdf&&!(cur.resource.upload&&cur.resource.upload.state==='uploading')?1:null); if(!document.hidden&&!document.querySelector('select:focus,input:focus,textarea:focus')&&!(v&&!v.paused)) load(true); },30000);
</script>
</body>
</html>
