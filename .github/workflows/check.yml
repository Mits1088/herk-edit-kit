name: Check Herk Edit Kit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      # Report every OS; one failure should not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Reel Studio tests synthesize and probe media with ffmpeg/ffprobe.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: ffmpeg -version
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run demo
      - run: node scripts/preflight.mjs video-projects/demo
      - run: npx hyperframes lint video-projects/demo
