<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>keyframes</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<script src="../../assets/brand/clawd-glyphs.js"></script>
<script>window.ClawdGlyphs = { Ho, Xe, Je, Qe, Ze, eo };</script>
<script src="../../assets/clawd.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#eceef1;font-family:"Inter",Arial,sans-serif}
:root{--ink:#15171a;--accent:#ebc934;--neg:#ff6b5b;--ok:#1f9d55}
.kf{position:absolute;inset:0;display:none}
.ground{position:absolute;inset:0;background:radial-gradient(ellipse 80% 38% at 50% 18%,rgba(255,255,255,.85),rgba(255,255,255,0) 70%),
  repeating-linear-gradient(0deg,rgba(20,24,30,.045) 0 1px,transparent 1px 40px),repeating-linear-gradient(90deg,rgba(20,24,30,.045) 0 1px,transparent 1px 40px),#eceef1}
.frame{position:absolute;border-radius:22px;background:#fff;overflow:hidden;box-shadow:0 34px 70px -18px rgba(20,24,30,.30),0 0 0 1px rgba(20,24,30,.08)}
.chrome{position:absolute;left:0;top:0;right:0;height:56px;background:#f6f6f7;border-bottom:1px solid rgba(20,24,30,.08)}
.dot{position:absolute;top:21px;width:15px;height:15px;border-radius:50%}
.pill{position:absolute;top:8px;height:40px;border-radius:20px;background:#fff;box-shadow:0 0 0 1px rgba(20,24,30,.08);line-height:40px;text-align:center;font-size:30px;font-weight:600;color:#3b3f45}
.pill i{font-style:normal;font-weight:500;color:#8a9099}
.view{position:absolute;left:0;top:56px;right:0;bottom:0;overflow:hidden}
.view img{display:block;width:100%}
.cap{position:absolute;left:0;width:1080px;top:1030px;text-align:center}
.cap span{display:inline-block;background:var(--ink);color:#fff;font-weight:900;font-size:56px;line-height:1;letter-spacing:-.5px;text-transform:uppercase;padding:14px 26px 16px;border-radius:14px;box-shadow:0 0 0 2px rgba(255,255,255,.55),0 14px 30px -12px rgba(10,12,16,.45)}
.panel{position:absolute;left:50px;top:1142px;width:980px;height:830px;border-radius:40px;overflow:hidden;background:#101114;box-shadow:0 30px 60px -20px rgba(20,24,30,.35)}
.panel img{position:absolute;left:-294px;top:-6px;width:1536px;height:864px;object-fit:cover}
.chip{position:absolute;height:84px;border-radius:42px;padding:0 34px;display:flex;align-items:center;gap:18px;font-size:40px;font-weight:700;color:var(--ink);background:#fff;box-shadow:0 18px 40px -16px rgba(20,24,30,.35),0 0 0 1px rgba(20,24,30,.08)}
.chip b{font-weight:900;border-radius:12px;padding:6px 14px;font-size:40px}
.src{position:absolute;left:0;width:1080px;text-align:center;font-size:32px;color:#6b7280}
.clawd{position:absolute}
.handle{position:absolute;top:56px;bottom:0;width:4px;background:#fff;box-shadow:0 0 12px rgba(0,0,0,.25)}
.handle:after{content:"";position:absolute;left:-26px;top:50%;width:56px;height:56px;margin-top:-28px;border-radius:50%;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.ghost{position:absolute;border:3px dashed rgba(21,23,26,.22);border-radius:22px}
.wlabel{position:absolute;font-size:32px;font-weight:700;color:#3b3f45;display:flex;align-items:center;gap:10px}
.tick{display:inline-block;width:40px;height:40px;border-radius:50%;background:var(--ok);color:#fff;font-size:28px;line-height:40px;text-align:center;font-weight:900}
.wlabel.dim{color:#9aa0a8}
</style></head><body>

<!-- s06: so it knows what to avoid. The real comparison slider swept to Hallmark's side; 26 issues -> 0 issues. -->
<div class="kf" id="s06">
  <div class="ground"></div>
  <div class="chip" style="left:96px;top:250px;opacity:.5"><span style="text-decoration:line-through;text-decoration-thickness:4px">Opus alone</span><b style="background:#ffe3df;color:#c8352a">26 issues</b></div>
  <div class="chip" style="left:560px;top:250px;box-shadow:0 0 0 5px var(--accent),0 18px 40px -16px rgba(20,24,30,.35)">Hallmark<b style="background:#dcf5e5;color:var(--ok)">0 issues</b></div>
  <div class="src" style="top:362px">Issue counts from Hallmark's own checker · usehallmark.com</div>
  <div class="frame" style="left:115px;top:470px;width:850px;height:526px">
    <div class="view"><img src="../../assets/captures/compare-with.png"></div>
    <div class="chrome"><div class="dot" style="left:24px;background:#ff5f57"></div><div class="dot" style="left:48px;background:#febc2e"></div><div class="dot" style="left:72px;background:#28c840"></div>
      <div class="pill" style="left:200px;width:450px"><i>same prompt</i>&nbsp; with Hallmark</div></div>
  </div>
  <div class="cap"><span>so it knows what to avoid.</span></div>
  <div class="panel"><img src="../../tmp/face-18.png"></div>
  <div id="c06"></div>
</div>

<!-- s08: checks it on different size screens. The same real Refract page at 1440, 834 and 390 px. -->
<div class="kf" id="s08">
  <div class="ground"></div>
  <div class="ghost" style="left:60px;top:250px;width:960px;height:746px"></div>
  <div class="ghost" style="left:300px;top:250px;width:480px;height:746px;border-color:rgba(21,23,26,.30)"></div>
  <div class="wlabel dim" style="left:84px;top:196px"><span class="tick">✓</span>1440</div>
  <div class="wlabel dim" style="left:322px;top:196px"><span class="tick">✓</span>834</div>
  <div class="frame" style="left:378px;top:250px;width:324px;height:746px;border-radius:30px">
    <div class="view" style="top:44px"><img src="../../assets/captures/refract-390.png"></div>
    <div class="chrome" style="height:44px"><div class="dot" style="left:18px;top:15px;width:13px;height:13px;background:#ff5f57"></div><div class="dot" style="left:38px;top:15px;width:13px;height:13px;background:#febc2e"></div><div class="dot" style="left:58px;top:15px;width:13px;height:13px;background:#28c840"></div></div>
  </div>
  <div class="wlabel" style="left:718px;top:196px"><span class="tick">✓</span>390 px</div>
  <div class="cap"><span>different size screens</span></div>
  <div class="panel"><img src="../../tmp/face-26.png"></div>
  <div id="c08"></div>
</div>

<script>
const id = location.hash.slice(1) || 's06';
document.getElementById(id).style.display = 'block';
function clawd(host, x, y, cell, pose) { const d = document.createElement('div'); d.className = 'clawd'; Object.assign(d.style, { left: x + 'px', top: y + 'px' });
  d.innerHTML = window.Clawd.svg(pose, cell); document.getElementById(host).appendChild(d); }
clawd('c06', 838, 470 - 78 + 4, 13, { arms: 'up' });
clawd('c08', 716, 996 - 78 + 4, 13, { eyes: 'left', arms: 'down' });
</script>
</body></html>
